# =========================================================================
# Dog API - Test Configuration
# -------------------------------------------------------------------------
# Any value below can be overridden at runtime via a system property or an
# environment variable of the same key, e.g.:
#   ./mvnw test -Dbase.uri=https://dog.ceo -Dbase.path=/api
# This keeps the suite portable across local machines and CI environments.
# =========================================================================

# Base URI of the Dog CEO API
base.uri=https://dog.ceo

# Base path prefixed to every endpoint
base.path=/api

# Connection / socket timeouts in milliseconds
timeout.connection.ms=10000
timeout.socket.ms=30000

# When true, every request/response is logged (verbose). CI keeps it lean.
http.logging.enabled=false
